# Project-local mpv config for ytm (loaded via --config-dir; the global
# %APPDATA%\mpv config is not read or modified).

# --- audio only, no window ---
vid=no
audio-display=no
force-window=no
ytdl-format=bestaudio/best

# --- keep memory small ---
cache=yes
demuxer-max-bytes=24MiB
demuxer-max-back-bytes=4MiB
demuxer-readahead-secs=20
# built-in Lua scripts that are useless without a window
osc=no
load-console=no
load-stats-overlay=no
load-auto-profiles=no
load-select=no
load-commands=no
load-positioning=no
load-context-menu=no

# --- yt-dlp ---
# Deno is yt-dlp's default JS runtime; also allow Node as a fallback.
ytdl-raw-options=js-runtimes=node

# --- playback ---
volume=70
volume-max=100
# resolve the next playlist entry before the current one ends (no gap between songs)
prefetch-playlist=yes
gapless-audio=weak

# --- terminal UI ---
msg-level=all=warn,ytdl_hook=warn,statusline=status
term-osd-bar=yes
term-osd-bar-chars=[=> ]
term-status-msg=[${playlist-pos-1}/${playlist-count}] ${media-title}\n${?pause==yes:(paused) }${time-pos} / ${duration} (${percent-pos}%)  vol ${volume}%${?mute==yes: (muted)}
