[project]
name = "ytm"
version = "0.5.1"  # keep in step with ytm/__init__.py
requires-python = ">=3.12"
dependencies = [
    "textual>=8.0",
    "ytmusicapi>=1.10",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.uv]
# An app run from its folder, not a package to build or publish.
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Only real-bug rules (syntax errors, unused/undefined names); no style enforcement.
select = ["E9", "F"]
