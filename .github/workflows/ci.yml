name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q ytm dev
      - name: Lint
        run: ruff check .
      - name: Replay known breaks
        shell: bash
        run: |
          shopt -s nullglob
          files=(dev/breaks/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No break scenarios yet; skipping."
          else
            python dev/try.py "${files[@]}"
          fi
