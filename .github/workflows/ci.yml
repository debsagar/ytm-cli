name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked   # fails if uv.lock is out of date
      - name: Compile
        run: uv run python -m compileall -q ytm dev
      - name: Lint
        run: uv run ruff check .
      - name: Replay known breaks
        shell: bash
        run: |
          shopt -s nullglob
          files=(dev/breaks/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No break scenarios yet; skipping."
          else
            uv run python dev/try.py "${files[@]}"
          fi
